name: Hy2UI
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    macOS: '14.0'
configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig
settings:
  configs:
    Debug:
      HY2_NATIVE_PROFILE: debug
    Release:
      HY2_NATIVE_PROFILE: release
  base:
    SWIFT_VERSION: '5.0'
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  Hy2UI:
    type: application
    platform: macOS
    sources:
      - App
      - Shared
      - Connection
      - path: .build/generated/HelperInstallerPayload.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HY2_BUNDLE_PREFIX).app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Hy2UI
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
    dependencies:
      - sdk: SystemConfiguration.framework
      - sdk: Security.framework
    preBuildScripts:
      - name: Prepare upstream CLI and macOS helper
        script: |
          set -eu
          case "$ARCHS" in *" "*) echo "Build one architecture at a time." >&2; exit 1 ;; esac
          "$SRCROOT/Scripts/build-native.sh" "$HY2_NATIVE_PROFILE" "$ARCHS"
        inputFiles:
          - $(SRCROOT)/Scripts/build-native.sh
          - $(SRCROOT)/Scripts/prepare-cli.py
          - $(SRCROOT)/Shared/CLITunConfiguration.swift
          - $(SRCROOT)/Shared/LocalDNSPolicy.swift
          - $(SRCROOT)/Shared/IPNetwork.swift
          - $(SRCROOT)/Shared/LocalTunIPC.swift
          - $(SRCROOT)/Shared/CoreFlowDiagnostic.swift
          - $(SRCROOT)/Shared/CoreDiagnosticParser.swift
          - $(SRCROOT)/LocalTunHelper/HelperInstanceLock.swift
          - $(SRCROOT)/LocalTunHelper/HelperSocket.swift
          - $(SRCROOT)/LocalTunHelper/LocalDNSResolvers.swift
          - $(SRCROOT)/LocalTunHelper/LocalTunServer.swift
          - $(SRCROOT)/LocalTunHelper/PrivilegedDNS.swift
          - $(SRCROOT)/LocalTunHelper/PrivilegedWorker.swift
          - $(SRCROOT)/LocalTunHelper/TrustedInstallation.swift
          - $(SRCROOT)/LocalTunHelper/main.swift
        outputFiles:
          - $(SRCROOT)/.build/native/$(HY2_NATIVE_PROFILE)/$(ARCHS)/hysteria
          - $(SRCROOT)/.build/native/$(HY2_NATIVE_PROFILE)/$(ARCHS)/hy2-tun-worker
          - $(SRCROOT)/.build/native/$(HY2_NATIVE_PROFILE)/$(ARCHS)/hy2-local-tun-helper
        # Core selection may change through a local manifest or environment variable.
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: Embed upstream CLI
        script: |
          set -eu
          mkdir -p "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers"
          native_arch="${ARCHS%% *}"
          # Remove retired extension code left in an incremental app bundle from an older build.
          rm -rf "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Library/SystemExtensions"
          for binary in hysteria hy2-tun-worker hy2-local-tun-helper; do
            cp "$SRCROOT/.build/native/$HY2_NATIVE_PROFILE/$native_arch/$binary" "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers/$binary"
          done
          if [ "${CODE_SIGNING_ALLOWED:-NO}" = YES ] && [ -n "${EXPANDED_CODE_SIGN_IDENTITY:-}" ]; then
            for binary in hysteria hy2-tun-worker hy2-local-tun-helper; do
              codesign --force --options runtime --sign "$EXPANDED_CODE_SIGN_IDENTITY" "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers/$binary"
            done
          fi
        basedOnDependencyAnalysis: false
schemes:
  Hy2UI:
    build:
      targets:
        Hy2UI: all
