[package]
name = "hy2-bridge"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
hysteria-cli = { path = "../../.build/core/crates/hysteria" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
libc = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "signal"] }

[dev-dependencies]
futures = "0.3"
netstack-smoltcp = "=0.2.5"
tempfile = "3"
